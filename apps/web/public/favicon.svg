<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <style>
    .bg { fill: #FAF8F5; }
    .base-stone { fill: #191512; }
    .top-stone { fill: #BD5B2C; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #191512; }
      .base-stone { fill: #FAF8F5; }
      .top-stone { fill: #D07F4F; }
    }
  </style>
  
  <!-- Container Squircle Background -->
  <rect class="bg" width="128" height="128" rx="28" />
  
  <!-- Base Stone -->
  <path
    class="base-stone"
    d="M 28 88 C 28 81, 38 78, 64 78 C 90 78, 100 81, 100 88 C 100 95, 90 98, 64 98 C 38 98, 28 95, 28 88 Z"
  />
  
  <!-- Middle Stone -->
  <path
    class="base-stone"
    d="M 34 60 C 34 53, 44 50, 64 50 C 84 50, 94 53, 94 60 C 94 67, 84 70, 64 70 C 44 70, 34 67, 34 60 Z"
  />
  
  <!-- Top Roof Stone (Gable Beacon) -->
  <path
    class="top-stone"
    d="M 64 20 L 86 36 C 88 38, 86 42, 80 43 C 70 44, 58 44, 48 43 C 42 42, 40 38, 42 36 Z"
  />
</svg>
