name: Keep Render API warm

# Render's free plan spins the api service down after ~15 minutes of no traffic, so the next
# real user request pays for a cold start (Docker container boot). Pinging /api/health often
# enough keeps it warm without needing a paid plan -- see docs/adr/0008-deployment-topology.md.
# GitHub Actions cron has ~5 min granularity and can slip under load, so this can't guarantee
# zero cold starts, only make them rare. Also note: GitHub disables scheduled workflows after
# 60 days with no commits to the repo -- a push to main re-enables it.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 5 "$API_HEALTH_URL"
        env:
          API_HEALTH_URL: https://cairn-api-urnv.onrender.com/api/health
