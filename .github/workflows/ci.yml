name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cairn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - run: pnpm exec nx format:check --base=origin/main
      - run: pnpm exec nx affected -t lint --base=origin/main
      - run: pnpm exec nx affected -t typecheck --base=origin/main
      - run: pnpm exec nx affected -t test --base=origin/main
        env:
          DATABASE_URL: postgresql://cairn:cairn@localhost:5432/cairn
          REDIS_URL: redis://localhost:6379
      - run: pnpm exec nx affected -t build --base=origin/main
