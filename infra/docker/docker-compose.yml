services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
      POSTGRES_DB: cairn
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']

  redis:
    image: redis:7
    ports: ['6380:6379']

  mailhog:
    # mailhog/mailhog is amd64-only and unmaintained; mailpit is a maintained,
    # multi-arch (incl. arm64/Apple Silicon), API-compatible drop-in replacement.
    image: axllent/mailpit
    ports: ['11025:1025', '18025:8025']

  adminer:
    image: adminer
    ports: ['8080:8080']

volumes:
  pgdata:
